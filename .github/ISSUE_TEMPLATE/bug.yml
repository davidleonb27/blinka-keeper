name: Error
description: Algo no funciona como dice la documentación.
title: "error: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportarlo. **Si el error hace que Blinka Keeper pague algo indebido, no sigas aquí:** repórtalo en privado
        según `SECURITY.md`.
  - type: textarea
    id: what
    attributes:
      label: Qué pasó
      description: Lo que viste, con el mensaje de error exacto si lo hay.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Cómo reproducirlo
      description: Pasos mínimos. Si aplica, la factura, el texto o la intención de pago (sin datos reales ni secretos).
      placeholder: |
        1. docker compose up --build
        2. curl -X POST .../api/v1/firewall/intents ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Dónde
      options:
        - Demo pública
        - Autoalojado con docker compose
        - Desplegado en Vercel
        - Desarrollo local
        - Otro
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión o commit
      placeholder: "0.1.0 o el SHA del commit"
  - type: checkboxes
    id: secrets
    attributes:
      label: Confirmación
      options:
        - label: Revisé que el reporte no incluye claves, tokens ni datos reales de personas o empresas.
          required: true
