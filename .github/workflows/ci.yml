name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: ./scripts/check.sh

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: compose file is valid
        run: docker compose config -q
      - uses: docker/setup-buildx-action@v3
      - name: build the api image (apps/api/Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          tags: custodio-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: build the web image (apps/web/Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: false
          build-args: API_INTERNAL_URL=http://api:8000
          tags: custodio-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
