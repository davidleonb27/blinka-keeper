<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blinka Keeper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Source+Serif+4:opsz,wght@8..60,500..700&display=swap">
<style>
:root {
  /* Layout: app shell. A floating ledger rail on the left, a wide working canvas on the right;
     security-print guilloche marks the figures that carry trust. Dark-first. */
  --bg: #0a1012;
  --surface: #0f171a;
  --surface-2: #142024;
  --surface-3: #1a282d;
  --line: rgba(170, 215, 222, .09);
  --line-2: rgba(170, 215, 222, .17);
  --grid: rgba(170, 215, 222, .07);
  --ink: #e4eded;
  --ink-2: #a3b3b5;
  --muted: #708386;
  --accent: #38c3d2;
  --accent-weak: rgba(56, 195, 210, .13);
  --on-accent: #032529;
  --pay: #34b977;
  --pay-weak: rgba(52, 185, 119, .14);
  --on-pay: #03200f;
  --esc: #eeb03c;
  --esc-weak: rgba(238, 176, 60, .14);
  --hold: #ee7b56;
  --hold-weak: rgba(238, 123, 86, .14);
  --crit: #e5484d;
  --crit-weak: rgba(229, 72, 77, .14);
  --scrim: rgba(3, 8, 10, .6);
  --shadow: 0 1px 0 rgba(255, 255, 255, .035) inset, 0 18px 40px -24px rgba(0, 0, 0, .75);
  --f-display: "Source Serif 4", ui-serif, Georgia, serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #edf2f2; --surface: #ffffff; --surface-2: #f3f7f7; --surface-3: #e6eeef;
    --line: rgba(12, 48, 54, .10); --line-2: rgba(12, 48, 54, .18); --grid: rgba(12, 48, 54, .07);
    --ink: #0b1618; --ink-2: #3b4c4f; --muted: #607376;
    --accent: #0a8494; --accent-weak: rgba(10, 132, 148, .10); --on-accent: #ffffff;
    --pay: #13804b; --pay-weak: rgba(19, 128, 75, .10); --on-pay: #ffffff;
    --esc: #9a6400; --esc-weak: rgba(214, 150, 20, .15);
    --hold: #bd4b25; --hold-weak: rgba(189, 75, 37, .10);
    --crit: #c42b31; --crit-weak: rgba(196, 43, 49, .10);
    --scrim: rgba(10, 30, 34, .35);
    --shadow: 0 1px 2px rgba(10, 40, 45, .05), 0 18px 40px -28px rgba(10, 40, 45, .35);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #edf2f2; --surface: #ffffff; --surface-2: #f3f7f7; --surface-3: #e6eeef;
  --line: rgba(12, 48, 54, .10); --line-2: rgba(12, 48, 54, .18); --grid: rgba(12, 48, 54, .07);
  --ink: #0b1618; --ink-2: #3b4c4f; --muted: #607376;
  --accent: #0a8494; --accent-weak: rgba(10, 132, 148, .10); --on-accent: #ffffff;
  --pay: #13804b; --pay-weak: rgba(19, 128, 75, .10); --on-pay: #ffffff;
  --esc: #9a6400; --esc-weak: rgba(214, 150, 20, .15);
  --hold: #bd4b25; --hold-weak: rgba(189, 75, 37, .10);
  --crit: #c42b31; --crit-weak: rgba(196, 43, 49, .10);
  --scrim: rgba(10, 30, 34, .35);
  --shadow: 0 1px 2px rgba(10, 40, 45, .05), 0 18px 40px -28px rgba(10, 40, 45, .35);
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--f-mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.sub { color: var(--muted); font-size: 12.5px; }

/* ---------- shell ---------- */
.app {
  display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 24px; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.nav {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start;
  margin-block: 16px; height: calc(100dvh - 32px); min-height: 520px;
  display: flex; flex-direction: column; gap: 18px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 12px 14px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand b { display: block; font: 650 20px/1 var(--f-display); letter-spacing: -.01em; }
.brand span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.nav-list { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 10px;
  border: 0; border-radius: 10px; background: transparent; color: var(--ink-2); cursor: pointer; text-align: left; font-weight: 500;
}
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--accent-weak); color: var(--ink); }
.nav-item[aria-current="page"] .i { color: var(--accent); }
.nav-item .count { margin-left: auto; font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--muted); }
.nav-item .badge { margin-left: auto; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--esc); color: var(--on-pay); font-size: 11.5px; font-weight: 700; display: grid; place-items: center; }
:root:not([data-theme="dark"]) .nav-item .badge { color: #1d1300; }
.nav-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 12px 8px 0; border-top: 1px solid var(--line); }
.company b { display: block; font-weight: 600; }
.company span { font-size: 12px; color: var(--muted); }
.demo-note { font-size: 11.5px; color: var(--muted); line-height: 1.45; }

.main { min-width: 0; padding-block: 16px 64px; }
.topbar { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding: 10px 2px 22px; }
.topbar h1 { font: 650 30px/1.1 var(--f-display); letter-spacing: -.02em; }
.topbar p { color: var(--ink-2); margin-top: 6px; max-width: 62ch; }
.top-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px; border-radius: 99px; border: 1px solid var(--line-2); background: var(--surface); font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.chip b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.chip .i { width: 15px; height: 15px; }
.chip.ok { border-color: transparent; background: var(--pay-weak); color: var(--pay); font-weight: 600; }
.chip.bad { border-color: transparent; background: var(--crit-weak); color: var(--crit); font-weight: 600; }
.chip.dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

/* ---------- building blocks ---------- */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.span-3 { grid-column: span 3; } .span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; }
.span-6 { grid-column: span 6; } .span-7 { grid-column: span 7; } .span-8 { grid-column: span 8; } .span-12 { grid-column: span 12; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; }
.card-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card-h h3, .card > h3 { font: 600 15px/1.3 var(--f-body); }
.card-h .sub { margin-top: 3px; }
.eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.section-gap { margin-top: 16px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px;
  border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink);
  font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; text-decoration: none;
}
.btn:hover { background: var(--surface-3); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn .i { width: 16px; height: 16px; }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; border-radius: 8px; }
.btn.ghost { background: transparent; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.approve { background: var(--pay); color: var(--on-pay); border-color: transparent; }
.btn.approve:hover { filter: brightness(1.08); }
.btn.reject { color: var(--hold); border-color: color-mix(in srgb, var(--hold) 45%, transparent); background: transparent; }
.btn.reject:hover { background: var(--hold-weak); }

.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px 0 7px; border-radius: 99px; font-weight: 600; font-size: 12px; white-space: nowrap; }
.pill .i { width: 14px; height: 14px; stroke-width: 2.1; }
.pill.pay { background: var(--pay-weak); color: var(--pay); }
.pill.hold { background: var(--hold-weak); color: var(--hold); }
.pill.esc { background: var(--esc-weak); color: var(--esc); }
.pill.lg { height: 30px; font-size: 13px; padding: 0 12px 0 9px; }

.meter { height: 6px; border-radius: 99px; background: var(--accent-weak); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
.meter.pay { background: var(--pay-weak); } .meter.pay > i { background: var(--pay); }

/* ---------- resumen ---------- */
.hero { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; min-height: 300px; padding: 22px; }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.hero > * { position: relative; }
.hero .big { font: 640 112px/0.95 var(--f-body); letter-spacing: -.05em; margin: 18px 0 14px; color: var(--ink); }
.hero .big.bad { color: var(--crit); }
.hero p { color: var(--ink-2); max-width: 40ch; }
.hero .row-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.stat { display: flex; flex-direction: column; gap: 8px; }
.stat .l { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.stat .v { font: 620 34px/1.05 var(--f-body); letter-spacing: -.02em; }
.stat .v small { font-size: 15px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.stat .d { font-size: 12.5px; color: var(--muted); }
.stat .act { margin-top: auto; }

.flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; padding: 0; overflow: hidden; }
.flow-step { padding: 18px; display: flex; flex-direction: column; gap: 6px; position: relative; }
.flow-step + .flow-step { border-left: 1px solid var(--line); }
.flow-step .n { display: flex; align-items: center; gap: 8px; }
.flow-step .n span { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; background: var(--accent-weak); color: var(--accent); }
.flow-step .n b { font: 650 16px/1.2 var(--f-display); }
.flow-step .tag { font-style: normal; margin-left: auto; font-size: 11px; color: var(--muted); border: 1px solid var(--line-2); border-radius: 99px; padding: 1px 8px; }
.flow-step p { color: var(--ink-2); font-size: 13px; }
.flow-step.person .n span { background: var(--esc-weak); color: var(--esc); }
.flow-note { grid-column: 1 / -1; border-top: 1px solid var(--line); padding: 10px 18px; font-size: 12px; color: var(--muted); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: -4px 0 10px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font-family: var(--f-body); font-size: 11px; fill: var(--muted); }
.chart text.v { fill: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.chart text.lab { fill: var(--ink-2); font-size: 12px; }
.chart .hit { fill: transparent; cursor: default; }
.chart .hit:hover, .chart .hit:focus { fill: var(--grid); outline: none; }
.chart-table table { font-size: 12.5px; }

.recent { display: flex; flex-direction: column; }
.recent button { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 170px minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 11px 6px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 8px; }
.recent button:last-child { border-bottom: 0; }
.recent button:hover { background: var(--surface-2); }
.recent button:focus-visible { outline: 2px solid var(--accent); }
.recent .who { min-width: 0; }
.recent .pill { justify-self: start; }
.recent .who b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent .who span { display: block; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent .amt { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.recent .amt span { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }

/* ---------- tables ---------- */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
.filter { height: 32px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line-2); background: transparent; color: var(--ink-2); cursor: pointer; font-size: 12.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.filter b { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; }
.filter[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.filter[aria-pressed="true"] b { color: inherit; opacity: .7; }
.search { margin-left: auto; height: 34px; width: min(260px, 100%); border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface-2); padding: 0 12px; }
.tbl-wrap { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
td.mono { white-space: nowrap; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.row { cursor: pointer; }
tr.row:hover td, tr.row:focus-visible td { background: var(--surface-2); }
tr.row:focus-visible { outline: none; }
.vendor b { display: block; font-weight: 600; white-space: nowrap; }
.vendor span { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.vendor .i { width: 14px; height: 14px; }
.reason { color: var(--ink-2); font-size: 13px; min-width: 190px; }
.bench { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; white-space: nowrap; }
.bench.ok { color: var(--pay); } .bench.no { color: var(--crit); } .bench .i { width: 14px; height: 14px; }

/* ---------- acta ---------- */
.drawer { position: fixed; inset: 0; z-index: 50; display: flex; justify-content: flex-end; }
.drawer .scrim { position: absolute; inset: 0; background: var(--scrim); backdrop-filter: blur(2px); }
.drawer .panel {
  position: relative; width: min(620px, 100%); height: 100%; overflow-y: auto; background: var(--surface); border-left: 1px solid var(--line-2);
  padding: calc(env(safe-area-inset-top, 0px) + 18px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 28px) 22px;
  animation: slidein .22s ease-out;
}
@keyframes slidein { from { transform: translateX(24px); opacity: .4; } to { transform: none; opacity: 1; } }
.drawer-bar { position: sticky; top: 0; height: 0; z-index: 3; display: flex; justify-content: flex-end; }
.drawer .close { margin-top: -4px; box-shadow: var(--shadow); }
.acta { display: flex; flex-direction: column; gap: 22px; }
.acta-head { display: flex; flex-direction: column; gap: 10px; padding-right: 96px; }
.play-result .acta-head, .card > .acta .acta-head { padding-right: 0; }
.acta-head h2 { font: 650 24px/1.15 var(--f-display); letter-spacing: -.01em; }
.acta-head .amt { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.acta-head .amt b { font: 620 26px/1 var(--f-body); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.acta-head .amt span { color: var(--muted); }
.acta h4 { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
.why { font-size: 15px; line-height: 1.6; color: var(--ink); max-width: 62ch; }
.cf { margin: 0; padding-left: 18px; color: var(--ink-2); display: flex; flex-direction: column; gap: 4px; }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.ck { display: grid; grid-template-columns: 22px 32px minmax(0, 1fr); gap: 8px; padding: 10px 12px; align-items: start; }
.ck + .ck { border-top: 1px solid var(--line); }
.ck-i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--pay-weak); color: var(--pay); }
.ck-i .i { width: 13px; height: 13px; stroke-width: 2.4; }
.ck.skip .ck-i { background: var(--surface-3); color: var(--muted); }
.ck.fail.hold { background: var(--hold-weak); } .ck.fail.hold .ck-i { background: var(--hold); color: var(--surface); }
.ck.fail.escalate { background: var(--esc-weak); } .ck.fail.escalate .ck-i { background: var(--esc); color: var(--surface); }
.ck-id { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); padding-top: 2px; }
.ck strong { font-weight: 600; font-size: 13px; }
.ck p { color: var(--ink-2); font-size: 12.5px; margin-top: 1px; }
.ck.skip strong, .ck.skip p { color: var(--muted); }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.field { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; }
.field:hover, .field:focus-visible { border-color: var(--accent); }
.field .fl { font-size: 11.5px; color: var(--muted); }
.field .cv { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.field .fv { grid-column: 1 / -1; font-weight: 600; overflow-wrap: anywhere; }
.field .fv em { font-style: normal; color: var(--crit); font-weight: 500; }
.field .conf { grid-column: 1 / -1; height: 3px; border-radius: 9px; background: var(--surface-3); overflow: hidden; margin-top: 4px; }
.field .conf i { display: block; height: 100%; background: var(--accent); }
.field.low .conf i { background: var(--esc); }
.doc { font-family: var(--f-mono); font-size: 12.5px; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.doc mark { background: var(--accent-weak); color: inherit; border-radius: 4px; padding: 1px 2px; box-shadow: inset 0 -1.5px 0 var(--accent); transition: background .15s; }
.doc mark.on { background: var(--accent); color: var(--on-accent); }
.doc-meta { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; margin-bottom: 8px; }
.doc-meta .i { width: 15px; height: 15px; }
.hidden-layer { margin-top: 10px; border: 1px dashed var(--crit); background: var(--crit-weak); border-radius: 12px; padding: 12px 14px; }
.hidden-layer .doc-meta { color: var(--crit); font-weight: 600; margin-bottom: 4px; }
.hidden-layer p { font-family: var(--f-mono); font-size: 12.5px; }
details.more { border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; }
details.more > summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0; font-weight: 600; font-size: 13px; color: var(--ink-2); }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: '+'; font-size: 18px; line-height: 1; color: var(--muted); }
details.more[open] > summary::after { content: '−'; }
details.more[open] { padding-bottom: 14px; }
details.more .checks { margin-top: 2px; }
.ledger-line { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
.ledger-line code { font-family: var(--f-mono); color: var(--ink-2); }
.acta-actions { position: sticky; bottom: calc(-28px - env(safe-area-inset-bottom, 0px)); margin: 0 -22px -28px; padding: 14px 22px calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line-2); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.acta-actions .who { font-size: 12.5px; color: var(--muted); margin-right: auto; }

/* ---------- aprobaciones ---------- */
.ap-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.ap { display: flex; flex-direction: column; gap: 12px; }
.ap-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.ap-top b { display: block; font-weight: 650; font-size: 15px; }
.ap-top span { font-size: 12.5px; color: var(--muted); }
.ap .amt { text-align: right; font-weight: 650; font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ap .amt span { display: block; font-weight: 400; }
.reasons { display: flex; flex-wrap: wrap; gap: 6px; }
.reason-chip { font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 99px; background: var(--esc-weak); color: var(--esc); }
.ap p { color: var(--ink-2); font-size: 13px; }
.ap-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
.ap-actions .btn:first-child { margin-right: auto; }
.phone { width: 100%; max-width: 340px; margin: 0 auto; border-radius: 26px; border: 1px solid var(--line-2); background: var(--surface-2); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.phone-h { display: flex; align-items: center; gap: 10px; padding: 4px 6px 10px; border-bottom: 1px solid var(--line); }
.phone-h .av { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-weak); display: grid; place-items: center; }
.phone-h .av svg { width: 22px; height: 22px; }
.phone-h b { display: block; font-size: 13px; } .phone-h span { font-size: 11.5px; color: var(--muted); }
.bubble { max-width: 88%; padding: 9px 12px; border-radius: 14px; font-size: 13px; line-height: 1.45; }
.bubble.in { background: var(--surface); border: 1px solid var(--line); border-top-left-radius: 4px; }
.bubble.out { align-self: flex-end; background: var(--pay-weak); border-top-right-radius: 4px; }
.bubble small { display: block; text-align: right; font-size: 10.5px; color: var(--muted); margin-top: 3px; }
.history { display: flex; flex-direction: column; }
.history div { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.history div:last-child { border-bottom: 0; }
.history .who { margin-left: auto; color: var(--muted); font-size: 12px; }
.empty { text-align: center; padding: 36px 16px; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }
.approver { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); }
select, .input, textarea { height: 36px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface-2); padding: 0 10px; }
textarea { height: auto; width: 100%; padding: 12px 14px; font-family: var(--f-mono); font-size: 12.5px; line-height: 1.65; resize: vertical; }

/* ---------- reglas ---------- */
.rule-row { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 6px 14px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); }
.rule-row:last-child { border-bottom: 0; }
.rule-row label { font-weight: 600; font-size: 13.5px; }
.rule-row .help { grid-column: 1; color: var(--muted); font-size: 12.5px; }
.rule-row .numbox { grid-row: 1 / span 2; grid-column: 2; display: flex; align-items: center; gap: 6px; }
.rule-row .numbox input { width: 100%; height: 36px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface-2); padding: 0 10px; font-family: var(--f-mono); font-size: 13px; text-align: right; }
.rule-row .numbox span { font-size: 12px; color: var(--muted); min-width: 30px; }
.rule-row input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 4px 0 0; }
.rule-row.changed label::after { content: "cambió"; margin-left: 8px; font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-weak); border-radius: 99px; padding: 1px 7px; }
.cur-chips { display: flex; flex-wrap: wrap; gap: 6px; grid-column: 1 / -1; }
.cur-chips label { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 99px; border: 1px solid var(--line-2); font-size: 12.5px; font-weight: 500; cursor: pointer; }
.cur-chips input { accent-color: var(--accent); margin: 0; }
.sim { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
.sim-deltas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.delta { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.delta span { display: block; font-size: 12px; color: var(--muted); }
.delta b { font-size: 17px; font-variant-numeric: tabular-nums; }
.delta em { font-style: normal; font-size: 12px; margin-left: 6px; color: var(--muted); }
.changes { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; max-height: 340px; overflow-y: auto; }
.change { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
.change b { font-weight: 600; font-size: 13px; }
.change .arrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.change .arrow .i { width: 14px; height: 14px; color: var(--muted); }
.nl { display: flex; gap: 8px; }
.nl input { flex: 1; min-width: 0; height: 40px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface-2); padding: 0 12px; }
.examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

.nl-out { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.nl-out .note { color: var(--muted); }
.switch { appearance: none; width: 36px; height: 22px; border-radius: 99px; background: var(--surface-3); border: 1px solid var(--line-2); position: relative; cursor: pointer; margin: 0; flex: none; }

.switch:checked { background: var(--pay-weak); border-color: var(--pay); }

/* ---------- prueba ---------- */

.play-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }

.counters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }

.viol p { color: var(--ink-2); max-width: 52ch; }
.viol.bad { background: var(--crit-weak); } .viol.bad b { color: var(--crit); }
.progress { height: 6px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; }
.stress-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-bottom: 14px; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }

/* ---------- registro ---------- */
.banner { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; font-size: 13.5px; margin-bottom: 14px; }

tr.tampered td { background: var(--crit-weak); }
.hash { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.evt { font-weight: 600; white-space: nowrap; }
.copybox { margin-top: 12px; }

/* ---------- overlays ---------- */
.tip { position: fixed; z-index: 90; pointer-events: none; background: var(--surface-3); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 10px; box-shadow: var(--shadow); font-size: 12px; min-width: 160px; }
.tip .t { color: var(--muted); margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 8px; justify-content: space-between; line-height: 1.7; }
.tip .r span { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-2); }
.tip .r i { width: 12px; height: 2px; border-radius: 2px; display: inline-block; }
.tip .r strong { font-variant-numeric: tabular-nums; color: var(--ink); }
.toast {
  position: fixed; z-index: 95; right: calc(env(safe-area-inset-right, 0px) + 18px); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  max-width: min(420px, calc(100vw - 36px)); background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 500; box-shadow: var(--shadow);
}

}

  const S = {

  // ---------- state ----------
  function invoices(rules) { return S.docs.map(d => E.extract(d, rules || S.rules)); }

  function nowTs() {
    const d = new Date();
    return E.TODAY + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function shortSummary(r) {
    if (r.status === 'pay') return 'Pago dentro de las reglas.';
    const f = r.checks.filter(c => c.status === 'fail');

  function ledgerAppend(e) {
    const prev = S.ledger.length ? S.ledger[S.ledger.length - 1].hash : '0'.repeat(64);
    const body = { seq: S.ledger.length + 1, ts: e.ts, type: e.type, ref: e.ref || '', decision: e.decision || '', summary: e.summary, actor: e.actor };
    const hash = E.sha256(prev + '|' + JSON.stringify(body));
    S.ledger.push(Object.assign(body, { prev, hash }));
    return body.seq;
  }
  function verifyChain() {
    let prev = '0'.repeat(64);
    for (const e of S.ledger) {
      const body = { seq: e.seq, ts: e.ts, type: e.type, ref: e.ref, decision: e.decision, summary: e.summary, actor: e.actor };
      if (e.prev !== prev || E.sha256(prev + '|' + JSON.stringify(body)) !== e.hash) return { ok: false, at: e.seq, n: S.ledger.length };
      prev = e.hash;
    }
    return { ok: true, n: S.ledger.length };
  }

  function seedLedger() {
    S.ledger = []; S.seqOf = {};
    const R = S.rules;
    ledgerAppend({ ts: '2026-10-01 08:00', type: 'Reglas', summary: 'Reglas de fábrica: tope ' + usd(R.approvalThresholdUSD) + ', límite ' + usd(R.perPaymentLimitUSD) + ', presupuesto ' + usd(R.periodBudgetUSD) + ', reserva ' + usd(R.reserveUSD) + ', ' + R.beneficiaries.length + ' beneficiarios.', actor: APPROVERS[0] });
    let minute = 0, day = '';
    S.results.forEach(r => {
      if (r.inv.receivedAt !== day) { day = r.inv.receivedAt; minute = 0; }
      minute += 7;
      const ts = r.inv.receivedAt + ' ' + String(9 + Math.floor(minute / 60)).padStart(2, '0') + ':' + String(minute % 60).padStart(2, '0');
      S.seqOf[r.id] = ledgerAppend({ ts, type: 'Decisión', ref: r.id, decision: AGENT[r.agent], summary: shortSummary(r), actor: 'Blinka Keeper (agente)' });
    });
  }

  function recompute(cause) {
    const prev = new Map(S.results.map(r => [r.id, r.status]));
    S.results = E.decideAll(invoices(), S.rules, S.approvals);
    S.audit = E.audit(S.results, S.rules);
    if (!cause) return;
    let changed = 0;
    S.results.forEach(r => {
      const p = prev.get(r.id);
      if (!p) {
        S.seqOf[r.id] = ledgerAppend({ ts: nowTs(), type: 'Decisión', ref: r.id, decision: AGENT[r.agent], summary: shortSummary(r), actor: 'Blinka Keeper (agente)' });
      } else if (p !== r.status && !(cause.skip || []).includes(r.id)) {
        changed++;
        S.seqOf[r.id] = ledgerAppend({ ts: nowTs(), type: 'Nueva decisión', ref: r.id, decision: DEC[r.status].label, summary: DEC[p].label + ' → ' + DEC[r.status].label + ' por ' + cause.why + '.', actor: 'Blinka Keeper (agente)' });
      }
    });
    return changed;
  }

  function metrics(results, rules) {
    const n = results.length;
    const sum = arr => arr.reduce((s, r) => s + (isFinite(r.usd) ? r.usd : 0), 0);
    const agent = a => results.filter(r => r.agent === a);
    const paid = results.filter(r => r.status === 'pay' || r.status === 'paid_human');
    const pending = results.filter(r => r.status === 'escalate');
    const last = results[results.length - 1];
    return {
      n, autoPay: agent('pay').length, hold: agent('hold').length, esc: agent('escalate').length,
      pending, pendingUSD: sum(pending), paidUSD: sum(paid), heldUSD: sum(agent('hold')),
      autonomy: n ? (n - agent('escalate').length) / n : 0,
      balance: results.balanceEnd !== undefined ? results.balanceEnd : rules.openingBalanceUSD, spent: results.spentEnd || 0
    };
  }

  function flowStep(n, title, tag, text, person) {

    '</article>';

  // ---------- chart data ----------
  function chartData(key) {
    const rs = S.results;
    if (key === 'days' || key === 'budget') {
      const lastDay = rs.reduce((m, r) => r.inv.receivedAt > m ? r.inv.receivedAt : m, E.TODAY);
      const days = [];
      for (let d = E.PERIOD.start; d <= lastDay; d = E.addDays(d, 1)) days.push(d);
      if (key === 'days') {
        const s = k => days.map(d => rs.filter(r => r.inv.receivedAt === d && r.agent === k).length);
        return { cats: days, series: [
          { label: 'Pagada sola', color: 'var(--pay)', values: s('pay') },
          { label: 'Frenada', color: 'var(--hold)', values: s('hold') },
          { label: 'Escalada', color: 'var(--esc)', values: s('escalate') }
        ] };
      }
      let cum = 0;
      const pts = days.map(d => {
        rs.forEach(r => { if (r.inv.receivedAt === d && r.agent === 'pay') cum += r.usd; });
        return { d, v: cum };
      });
      return { pts, ref: S.rules.periodBudgetUSD };
    }
    if (key === 'traps') {
      const c = {};
      rs.forEach(r => r.checks.forEach(k => { if (k.status === 'fail') c[k.label] = (c[k.label] || 0) + 1; }));
      return { items: Object.keys(c).map(k => ({ label: k, value: c[k], display: String(c[k]) })).sort((a, b) => b.value - a.value), unit: 'facturas' };
    }
    if (key === 'country') {
      const c = {};
      rs.forEach(r => { if ((r.status === 'pay' || r.status === 'paid_human') && r.ben) { const k = E.COUNTRIES[r.ben.country]; c[k] = (c[k] || 0) + r.usd; } });
      return { items: Object.keys(c).map(k => ({ label: k, value: c[k], display: usd(c[k]) })).sort((a, b) => b.value - a.value), unit: 'USD' };
    }
    if (key === 'stress') {
      const st = S.stress.last || S.stress.live;
      const c = st ? st.ruleFails : {};
      return { items: Object.keys(c).map(k => ({ label: k, value: c[k], display: int(c[k]) })).sort((a, b) => b.value - a.value), unit: 'facturas' };
    }
  }

  function mountCharts() {
    $$('.chart[data-chart]').forEach(el => {

  function tableFor(key, d) {
    let head, rows;
    if (key === 'days') {
      head = ['Día'].concat(d.series.map(s => s.label));
      rows = d.cats.map((c, i) => [fmtDate(c)].concat(d.series.map(s => s.values[i])));
    } else if (key === 'budget') {
      head = ['Día', 'Pagado solo, acumulado', 'Cupo'];
      rows = d.pts.map(p => [fmtDate(p.d), usd(p.v), usd(d.ref)]);
    } else {
      head = [key === 'country' ? 'País' : 'Regla', key === 'country' ? 'Pagado' : 'Facturas'];
      rows = d.items.map(it => [it.label, it.display]);
    }
    return '<table><thead><tr>' + head.map((h, i) => '<th' + (i ? ' class="num"' : '') + '>' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' +
      rows.map(r => '<tr>' + r.map((c, i) => '<td' + (i ? ' class="num"' : '') + '>' + esc(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
  }

  // ---------- charts ----------
  function nice(max, ticks, integer) {
    if (!(max > 0)) max = 1;
    const raw = max / (ticks || 4), mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
    let step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
    if (integer) step = Math.max(1, Math.round(step));
    const top = Math.ceil(max / step) * step, vals = [];
    for (let v = 0; v <= top + 1e-9; v += step) vals.push(v);
    return { top, vals };
  }
  function compact(v) {
    if (v >= 1e6) return (v / 1e6).toLocaleString('es-CO', { maximumFractionDigits: 1 }) + ' M';
    if (v >= 1000) return (v / 1000).toLocaleString('es-CO', { maximumFractionDigits: 1 }) + ' K';
    return String(Math.round(v));
  }
  const tipAttr = o => ' data-tip="' + esc(JSON.stringify(o)) + '"';
  const topRound = (x, y, w, h, r) => { r = Math.max(0, Math.min(r, h, w / 2)); return 'M' + x + ',' + (y + h) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h) + 'Z'; };
  const rightRound = (x, y, w, h, r) => { r = Math.max(0, Math.min(r, w, h / 2)); return 'M' + x + ',' + y + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h - r) + 'Q' + (x + w) + ',' + (y + h) + ' ' + (x + w - r) + ',' + (y + h) + 'H' + x + 'Z'; };

  function drawStacked(el, d) {
    const W = Math.max(280, el.clientWidth), H = 230, m = { l: 30, r: 6, t: 10, b: 26 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const totals = d.cats.map((_, i) => d.series.reduce((s, se) => s + se.values[i], 0));
    const sc = nice(Math.max.apply(null, totals), 4, true);
    const y = v => m.t + ih - v / sc.top * ih;
    const band = iw / d.cats.length, bw = Math.min(24, band * 0.62);
    const every = Math.max(1, Math.ceil(26 / band));
    let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" height="' + H + '" role="img" aria-label="Decisiones por día">';
    sc.vals.forEach(v => { s += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(' + (v === 0 ? '--line-2' : '--grid') + ')" stroke-width="1"/><text x="' + (m.l - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>'; });
    d.cats.forEach((c, i) => {
      const x = m.l + band * i + (band - bw) / 2;
      const segs = d.series.map(se => ({ se, v: se.values[i] })).filter(o => o.v > 0);
      let acc = 0;
      segs.forEach((o, k) => {
        const top = y(acc + o.v), bottom = y(acc) - (k > 0 ? 2 : 0), h = bottom - top;
        if (h > 0) s += k === segs.length - 1 ? '<path d="' + topRound(x, top, bw, h, 4) + '" fill="' + o.se.color + '"/>' : '<rect x="' + x + '" y="' + top + '" width="' + bw + '" height="' + h + '" fill="' + o.se.color + '"/>';
        acc += o.v;
      });
      if (i % every === 0) s += '<text x="' + (m.l + band * i + band / 2) + '" y="' + (H - 8) + '" text-anchor="middle">' + Number(c.slice(8)) + '</text>';
      const tip = { t: fmtDate(c) + ' · ' + totals[i] + (totals[i] === 1 ? ' factura' : ' facturas'), rows: d.series.map(se => ({ k: se.label, v: String(se.values[i]), c: se.color })) };
      s += '<rect class="hit" tabindex="0" x="' + (m.l + band * i) + '" y="' + m.t + '" width="' + band + '" height="' + ih + '"' + tipAttr(tip) + '/>';
    });
    el.innerHTML = s + '</svg>';
  }

  function drawLine(el, d) {
    const W = Math.max(260, el.clientWidth), H = 230, m = { l: 40, r: 14, t: 18, b: 26 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const maxV = Math.max(d.ref, d.pts.reduce((a, p) => Math.max(a, p.v), 0));
    const sc = nice(maxV * 1.04, 4);
    const n = d.pts.length;
    const x = i => m.l + (n > 1 ? iw * i / (n - 1) : iw / 2);
    const y = v => m.t + ih - v / sc.top * ih;
    let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" height="' + H + '" role="img" aria-label="Pagado por el agente frente a su cupo">';
    sc.vals.forEach(v => { s += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(' + (v === 0 ? '--line-2' : '--grid') + ')"/><text x="' + (m.l - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + compact(v) + '</text>'; });
    const line = d.pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(p.v).toFixed(1)).join('');
    s += '<path d="' + line + 'L' + x(n - 1).toFixed(1) + ',' + y(0) + 'L' + x(0) + ',' + y(0) + 'Z" fill="var(--accent)" fill-opacity=".1"/>';
    s += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y(d.ref) + '" y2="' + y(d.ref) + '" stroke="var(--ink-2)" stroke-opacity=".55"/>';
    s += '<text x="' + (W - m.r) + '" y="' + (y(d.ref) - 6) + '" text-anchor="end">Cupo ' + usd(d.ref) + '</text>';
    s += '<path d="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    const last = d.pts[n - 1];
    s += '<circle cx="' + x(n - 1) + '" cy="' + y(last.v) + '" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>';
    s += '<text class="v" x="' + (x(n - 1) - 8) + '" y="' + (y(last.v) + 18) + '" text-anchor="end">' + usd(last.v) + '</text>';
    const every = Math.max(1, Math.ceil(26 / (iw / Math.max(1, n - 1))));
    d.pts.forEach((p, i) => { if (i % every === 0) s += '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + Number(p.d.slice(8)) + '</text>'; });
    s += '<g class="xh" visibility="hidden"><line y1="' + m.t + '" y2="' + (m.t + ih) + '" stroke="var(--ink-2)" stroke-opacity=".5"/><circle r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/></g>';
    s += '<rect class="ov" x="' + m.l + '" y="' + m.t + '" width="' + iw + '" height="' + ih + '" fill="transparent" tabindex="0"/>';
    el.innerHTML = s + '</svg>';
    const svg = el.firstChild, g = svg.querySelector('.xh'), ov = svg.querySelector('.ov');
    const show = (i, cx, cy) => {
      const p = d.pts[i];
      g.setAttribute('visibility', 'visible');
      g.firstChild.setAttribute('x1', x(i)); g.firstChild.setAttribute('x2', x(i));
      g.lastChild.setAttribute('cx', x(i)); g.lastChild.setAttribute('cy', y(p.v));
      showTip({ t: fmtDate(p.d), rows: [{ k: 'Pagado solo', v: usd(p.v), c: 'var(--accent)' }, { k: 'Cupo', v: usd(d.ref) }, { k: 'Margen', v: usd(d.ref - p.v) }] }, cx, cy);
    };
    ov.addEventListener('pointermove', e => {
      const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
      show(Math.max(0, Math.min(n - 1, Math.round((px - m.l) / iw * (n - 1)))), e.clientX, e.clientY);
    });
    ov.addEventListener('pointerleave', () => { g.setAttribute('visibility', 'hidden'); hideTip(); });
    ov.addEventListener('focus', () => { const r = ov.getBoundingClientRect(); show(n - 1, r.right - 40, r.top + 20); });
    ov.addEventListener('blur', () => { g.setAttribute('visibility', 'hidden'); hideTip(); });
  }

  function drawBars(el, d) {
    if (!d.items.length) { el.innerHTML = '<div class="empty"><b>Sin datos todavía</b>Aparecerán cuando haya decisiones.</div>'; return; }
    const W = Math.max(260, el.clientWidth), row = 30, H = d.items.length * row + 6;
    const lw = Math.min(190, Math.round(W * 0.42)), vw = 78, bx = lw + 10, bwMax = W - bx - vw;

    d.items.forEach((it, i) => {
      const yy = i * row + 3, bh = 12, by = yy + (row - bh) / 2 - 2, w = Math.max(2, it.value / max * bwMax);

  // ---------- guilloche ----------
  function drawGuilloche(cv) {
    const r = cv.getBoundingClientRect();
    if (!r.width) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = r.width * dpr; cv.height = r.height * dpr;
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, r.width, r.height);
    const col = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#38c3d2';
    ctx.strokeStyle = col; ctx.lineWidth = 0.7;
    const cx = r.width * 0.84, cy = r.height * 0.42, scale = Math.min(r.height, 360) * 0.034;
    [[11, 3, 6.2, 0.22], [11, 3, 4.6, 0.16], [13, 5, 7.4, 0.12]].forEach(([R, q, dd, a]) => {
      ctx.globalAlpha = a; ctx.beginPath();
      const steps = 2400, T = Math.PI * 2 * q;
      for (let k = 0; k <= steps; k++) {
        const t = T * k / steps;
        const px = (R - q) * Math.cos(t) + dd * Math.cos((R - q) / q * t);
        const py = (R - q) * Math.sin(t) - dd * Math.sin((R - q) / q * t);
        k ? ctx.lineTo(cx + px * scale, cy + py * scale) : ctx.moveTo(cx + px * scale, cy + py * scale);
      }
      ctx.stroke();
    });
    ctx.globalAlpha = 0.1;
    for (let j = 0; j < 16; j++) {
      ctx.beginPath();
      for (let px = 0; px <= r.width; px += 4) {
        const py = r.height - 56 + j * 3 + 7 * Math.sin(px * 0.028 + j * 0.42);
        px ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- acta ----------
  function highlightDoc(inv) {
    const text = inv.raw || '';
    const spans = Object.keys(inv.spans || {}).map(k => ({ k, s: inv.spans[k][0], e: inv.spans[k][1] })).sort((a, b) => a.s - b.s);
    let out = '', pos = 0;
    spans.forEach(sp => {
      if (sp.s < pos) return;
      out += esc(text.slice(pos, sp.s)) + '<mark data-span="' + sp.k + '">' + esc(text.slice(sp.s, sp.e)) + '</mark>';
      pos = sp.e;
    });
    return out + esc(text.slice(pos));
  }
  function renderActa(r, opts) {

    ];

  function runStress(n, opts, silent) {
    const st = { n, done: 0, pay: 0, hold: 0, escalate: 0, violations: 0, sets: 0, ruleFails: {}, workMs: 0, sabotage: !!opts.sabotage };
    const rand = E.rng32((Math.random() * 4294967296) >>> 0);
    S.stress.running = true; S.stress.live = st;
    const step = () => {
      const t = performance.now();
      while (st.done < n && performance.now() - t < 14) {
        const b = E.stressBatch(rand, S.rules, Math.min(40, n - st.done), opts);
        const rs = E.decideAll(b.invoices, b.rules, {}, { sabotage: opts.sabotage });
        st.sets++;
        rs.forEach(r => { st[r.agent]++; r.checks.forEach(c => { if (c.status === 'fail') st.ruleFails[c.label] = (st.ruleFails[c.label] || 0) + 1; }); });
        st.violations += E.audit(rs, b.rules).violations.length;
        st.done += rs.length;
      }
      st.workMs += performance.now() - t;
      if (S.view === 'prueba') paintStress(st);
      if (st.done < n) setTimeout(step, silent ? 0 : 16);
      else {
        S.stress.running = false; S.stress.live = null; S.stress.last = st;
        if (S.view === 'prueba' || S.view === 'resumen') render();
      }
    };
    step();
  }

        : '<div class="banner bad">' + icon('alert') + '<span>La cadena se rompe en el asiento #' + c.at + ': alguien cambió lo que dice después de escribirlo.</span></div>') +
      (S.copyText ? '<div class="copybox"><label class="sub" for="copy-area">No se pudo copiar solo. Selecciona el texto y cópialo.</label><textarea id="copy-area" rows="6" readonly>' + esc(S.copyText) + '</textarea></div>' : '') +
      '<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Fecha</th><th>Evento</th><th>Factura</th><th>Decisión</th><th>Detalle</th><th>Quién</th><th>Hash</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '</section>';
  }

  // ---------- toast ----------
  let toastTimer;
  function toast(text) { const t = $('#toast'); t.textContent = text; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 4200); }

  // ---------- events ----------
  function go(view) { if (S.view === view) return; S.view = view; try { history.replaceState(null, '', '#' + view); } catch (e) { /* ignore */ } render(); window.scrollTo(0, 0); }
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-action]');
    if (!a) return;
    const id = a.dataset.id;
    switch (a.dataset.action) {
      case 'nav': go(a.dataset.view); break;
      case 'open': openDrawer(id); break;
      case 'close': closeDrawer(); break;
      case 'approve': decide(id, 'approved'); break;
      case 'reject': decide(id, 'rejected'); break;
      case 'filter': S.filter = a.dataset.filter; render(); break;
      case 'toggle-table': S.chartTable[a.dataset.chart] = !S.chartTable[a.dataset.chart]; render(); break;
      case 'preset': S.play.preset = a.dataset.preset; S.play.text = presetDoc(S.play.preset).raw; analyze(); render(); break;
      case 'analyze': S.play.text = $('#play-text').value; analyze(); render(); break;
      case 'send': {
        if (!S.play.doc || S.play.sentAs) break;
        const n = 'F-' + String(S.docs.length + 1).padStart(3, '0');
        S.docs.push(Object.assign({}, S.play.doc, { id: n, added: true }));
        ledgerAppend({ ts: nowTs(), type: 'Factura recibida', ref: n, summary: 'Llegó por ' + CH[S.play.doc.channel].label.toLowerCase() + ' desde la prueba.', actor: 'Canal de entrada' });
        recompute({ why: 'la factura nueva ' + n });
        S.play.sentAs = n;
        const r = S.results.find(x => x.id === n);
        toast(n + ' entró a la bandeja: ' + DEC[r.status].label.toLowerCase() + '.');
        render(); break;
      }
      case 'stress':
        if (S.stress.running) break;
        S.stress.n = Number($('#st-n').value); S.stress.randomRules = $('#st-rr').checked; S.stress.sabotage = $('#st-sab').checked;
        S.stress.last = null;
        runStress(S.stress.n, { randomRules: S.stress.randomRules, sabotage: S.stress.sabotage });
        render(); break;
      case 'example': S.nlText = a.dataset.text; S.parsed = E.parseRule(S.nlText, S.draft); $('#nl').value = S.nlText; $('#nl-out').innerHTML = nlOut(); break;
      case 'use-parsed':
        (S.parsed ? S.parsed.changes : []).forEach(c => {
          if (c.key.startsWith('ben:')) { const b = S.draft.beneficiaries.find(x => x.id === c.key.slice(4)); if (b) b.allowed = c.value; }
          else S.draft[c.key] = c.value;
        });
        S.parsed = null; S.nlText = ''; render(); break;
      case 'apply-rules': {
        const diff = rulesDiff(S.rules, S.draft);
        if (!diff.length) break;
        S.rules = E.clone(S.draft);
        ledgerAppend({ ts: nowTs(), type: 'Reglas', summary: diff.join(' · '), actor: S.approver });
        const changed = recompute({ why: 'el cambio de reglas' });
        S.draft = E.clone(S.rules);
        toast('Reglas aplicadas. ' + (changed ? changed + (changed === 1 ? ' factura cambió' : ' facturas cambiaron') + ' de decisión.' : 'Ninguna factura cambió de decisión.'));
        render(); break;
      }
      case 'discard-rules': S.draft = E.clone(S.rules); S.parsed = null; render(); break;
      case 'verify': S.chain = verifyChain(); render(); toast(S.chain.ok ? 'Cadena verificada: ' + S.chain.n + ' asientos íntegros.' : 'La cadena está rota en el asiento #' + S.chain.at + '.'); break;
      case 'tamper': {
        const target = S.ledger.find(x => x.type === 'Decisión' && x.decision === 'Frenar') || S.ledger[1];
        S.tamper = { seq: target.seq, decision: target.decision, summary: target.summary };
        target.decision = 'Pagar'; target.summary = 'Pago dentro de las reglas.';
        render(); toast('Se cambió el asiento #' + target.seq + ' de «Frenar» a «Pagar» sin volver a sellarlo.'); break;
      }
      case 'untamper': {
        const t = S.ledger[S.tamper.seq - 1];
        t.decision = S.tamper.decision; t.summary = S.tamper.summary; S.tamper = null; render(); break;
      }
      case 'copy': {
        const text = JSON.stringify(S.ledger, null, 2);
        try {
          navigator.clipboard.writeText(text).then(() => { S.copyText = null; toast('Registro copiado: ' + S.ledger.length + ' asientos.'); }, () => { S.copyText = text; render(); });
        } catch (err) { S.copyText = text; render(); }
        break;
      }
      case 'reset':
        if (!S.resetArmed) { S.resetArmed = true; a.textContent = 'Toca otra vez para reiniciar'; setTimeout(() => { S.resetArmed = false; const b = $('#reset-btn'); if (b) b.textContent = 'Reiniciar demo'; }, 3000); break; }
        S.resetArmed = false; a.textContent = 'Reiniciar demo';
        S.rules = E.defaultRules(); S.docs = E.dataset(); S.approvals = {}; S.draft = null; S.parsed = null; S.tamper = null; S.copyText = null;
        S.play = { preset: 'cuenta', channel: 'email', text: '', result: null, sentAs: null };
        S.results = E.decideAll(invoices(), S.rules, {}); S.audit = E.audit(S.results, S.rules); seedLedger();
        closeDrawer(); render(); toast('Demo reiniciada con las 27 facturas de octubre.'); break;
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && S.openId) closeDrawer();
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr.row')) { e.preventDefault(); openDrawer(e.target.dataset.id); }
  });
  document.addEventListener('submit', e => {
    if (e.target.dataset.form === 'nl') {
      e.preventDefault();
      S.nlText = $('#nl').value; S.parsed = E.parseRule(S.nlText, S.draft); $('#nl-out').innerHTML = nlOut();
    }
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'search') { S.q = t.value; const pos = t.selectionStart; render(); const s = $('#search'); if (s) { s.focus(); s.setSelectionRange(pos, pos); } return; }
    if (t.id === 'play-text') { S.play.text = t.value; return; }
    if (t.dataset.rule) {
      const f = RULE_FORM.find(x => x.key === t.dataset.rule);
      let v = parseFloat(t.value); if (!isFinite(v)) return;
      const other = t.type === 'range' ? $('#r-' + f.key) : $('#rr-' + f.key);
      if (other) other.value = v;
      S.draft[f.key] = f.ratio ? v / 100 : v;
      refreshSim();
    }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'approver') { S.approver = t.value; render(); }
    else if (t.id === 'play-ch') { S.play.channel = t.value; S.play.text = presetDoc(S.play.preset).raw; analyze(); render(); }
    else if (t.dataset.ben) { const b = S.draft.beneficiaries.find(x => x.id === t.dataset.ben); b.allowed = t.checked; refreshSim(); }
    else if (t.dataset.currency) {
      const c = t.dataset.currency;
      S.draft.allowedCurrencies = t.checked ? S.draft.allowedCurrencies.concat([c]) : S.draft.allowedCurrencies.filter(x => x !== c);
      refreshSim();
    }
  });
  window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS.some(x => x.id === v)) go(v); });
  let rz;
  new ResizeObserver(() => { clearTimeout(rz); rz = setTimeout(() => { mountCharts(); $$('canvas.guilloche').forEach(drawGuilloche); }, 120); }).observe($('#view'));
  const redrawTheme = () => $$('canvas.guilloche').forEach(drawGuilloche);
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redrawTheme); } catch (e) { /* older browsers */ }
  new MutationObserver(redrawTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // ---------- boot ----------
  S.results = E.decideAll(invoices(), S.rules, {});
  S.audit = E.audit(S.results, S.rules);
  seedLedger();
  const fromHash = location.hash.slice(1);
  if (VIEWS.some(v => v.id === fromHash)) S.view = fromHash;
  render();
  if (/^F-\d{3}$/.test(fromHash) && S.results.some(r => r.id === fromHash)) { S.view = 'facturas'; render(); openDrawer(fromHash); }
  setTimeout(() => runStress(2000, { randomRules: true, sabotage: false }, true), 400);
})();
</script>
