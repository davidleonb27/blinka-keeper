[project]
name = "custodio-api"
version = "0.1.0"
description = "Custodio: the accounts-payable agent that cannot be tricked. The model reads, code decides, a person authorizes."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "anthropic>=0.75",
    "google-genai>=1.0",
    "pdfplumber>=0.11",
    "pypdf>=5.1",
    "reportlab>=4.2",
    "pillow>=11.0",
    "httpx>=0.27",
    "mcp>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.118",
    "ruff>=0.8",
    "uvicorn>=0.32",
    "mypy>=2.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"custodio/contracts.py" = ["S105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: calls a real external model API (Claude or Gemini); skipped unless CUSTODIO_LIVE_TESTS=1",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "reportlab.*", "google.*"]
ignore_missing_imports = true
