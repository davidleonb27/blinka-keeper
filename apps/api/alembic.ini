# Alembic CLI configuration. The app migrates itself on first request (custodio.db.Database.migrate);
# this file is for developers: `uv run alembic upgrade head` or `uv run alembic revision --autogenerate -m "..."`.
# The database URL comes from DATABASE_URL (see alembic/env.py), never from this file.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
