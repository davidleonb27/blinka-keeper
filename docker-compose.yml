# Blinka Keeper autoalojado en un comando:
#   cp .env.example .env   (opcional: todas las variables tienen un valor por defecto que funciona)
#   docker compose up --build
# Web en http://localhost:3000 · API en http://localhost:8000/api/v1 (documentación en /api/v1/docs)

name: custodio

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: custodio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-custodio}
      POSTGRES_DB: custodio
    volumes:
      - custodio-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U custodio -d custodio"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://custodio:${POSTGRES_PASSWORD:-custodio}@postgres:5432/custodio
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CUSTODIO_PAYMENT_RAIL: ${CUSTODIO_PAYMENT_RAIL:-simulated}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      CUSTODIO_RECEIPT_SIGNING_KEY: ${CUSTODIO_RECEIPT_SIGNING_KEY:-}
      CUSTODIO_LLM_DAILY_BUDGET_USD: ${CUSTODIO_LLM_DAILY_BUDGET_USD:-25}
      CUSTODIO_PUBLIC_BASE_URL: ${CUSTODIO_PUBLIC_BASE_URL:-http://localhost:3000}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10

  web:
    build:
      context: ./apps/web
      args:
        API_INTERNAL_URL: http://api:8000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"

volumes:
  custodio-data:
