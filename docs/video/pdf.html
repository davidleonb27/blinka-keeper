<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>factura-AC-2026-14.pdf</title>
<!--
  A plain PDF viewer for block 1 of the real-mouse demo: the page is the attack PDF rendered by pdftoppm, and on top
  of it sits a text layer built from `pdftotext -bbox`, the way PDF viewers make text selectable. Selecting with the
  mouse paints the selection; the words the PDF draws white on white become readable only there, as in a viewer.
  record.mjs fills it with window.load({ image, width, height, words }).
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: #3a3d41; font-family: "Inter", system-ui, sans-serif; overflow: hidden; }
  .bar { height: 48px; background: #26282b; color: #e8eaed; display: flex; align-items: center; gap: 14px; padding: 0 20px;
    font-size: 15px; }
  .bar .name { font-weight: 500; }
  .bar .meta { color: #9aa0a6; }
  .stage { position: absolute; top: 48px; left: 0; right: 0; bottom: 0; display: grid; place-items: start center; padding-top: 28px; }
  .page { position: relative; background: #fff; box-shadow: 0 6px 24px rgb(0 0 0 / .45); }
  .page img { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
  .text { position: absolute; inset: 0; }
  .text span { position: absolute; white-space: pre; color: transparent; font-family: "Liberation Sans", Helvetica, Arial, sans-serif; line-height: 1; transform-origin: 0 0; cursor: text; }
  .text span::selection { background: rgb(66 133 244 / .35); color: transparent; }
  .text span.hidden::selection { background: rgb(66 133 244 / .35); color: #b3261e; }
</style>
</head>
<body>
<div class="bar"><span class="name">factura-AC-2026-14.pdf</span><span class="meta">1 / 1 · 100 %</span></div>
<div class="stage"><div class="page" id="page"><img id="img" alt=""><div class="text" id="text"></div></div></div>
<script>
window.load = ({ image, width, height, words, scale }) => {
  const page = document.getElementById("page");
  page.style.width = width * scale + "px";
  page.style.height = height * scale + "px";
  document.getElementById("img").src = image;
  const layer = document.getElementById("text");
  for (const w of words) {
    const span = document.createElement("span");
    span.textContent = w.text + " ";
    if (w.hidden) span.className = "hidden";
    if (w.id) span.id = w.id;
    span.style.left = w.x0 * scale + "px";
    span.style.top = w.y0 * scale + "px";
    span.style.fontSize = (w.y1 - w.y0) * scale + "px";
    layer.appendChild(span);
    // Stretch each word to the width the PDF gives it, whatever the font's own metrics.
    span.style.transform = `scaleX(${((w.x1 - w.x0) * scale) / span.getBoundingClientRect().width * 1.04})`;
  }
  return document.getElementById("img").decode();
};
</script>
</body>
</html>
