<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Colors — night and accent tints</title><link rel="stylesheet" href="../colors_and_type.css"><style>:root{color-scheme:light}
body{margin:0;padding:32px;background:var(--bk-paper);color:var(--bk-ink);font-family:var(--bk-font-sans)}
.t{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--bk-muted);margin:0 0 20px;font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:16px}
.sw{width:150px}.sw i{display:block;height:84px;border-radius:12px;border:1px solid var(--bk-line)}
.sw b{display:block;font-size:13px;font-weight:500;margin-top:8px}.sw span{font:11px var(--bk-font-mono);color:var(--bk-muted)}
.chip{display:inline-flex;font-size:11px;padding:3px 8px;border-radius:8px;background:var(--bk-accent-wash);color:var(--bk-accent);font-weight:500}</style></head><body data-od-id="colors-night"><p class="t">Colors — night and accent tints</p><div class="row"><div class="sw"><i style="background:var(--bk-night)"></i><b>Night</b><span>#111720</span></div><div class="sw"><i style="background:var(--bk-night-ink)"></i><b>Night ink</b><span>#e9edf1</span></div><div class="sw"><i style="background:var(--bk-night-muted)"></i><b>Night muted</b><span>#b2bbc7</span></div><div class="sw"><i style="background:var(--bk-accent-soft)"></i><b>Accent soft</b><span>#b9c8ff</span></div><div class="sw"><i style="background:var(--bk-accent-wash)"></i><b>Accent wash</b><span>#f3f5fd</span></div><div class="sw"><i style="background:var(--bk-slate)"></i><b>Slate</b><span>#47525d</span></div></div></body></html>
