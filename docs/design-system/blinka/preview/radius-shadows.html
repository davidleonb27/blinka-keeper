<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Radius and shadows</title><link rel="stylesheet" href="../colors_and_type.css"><style>:root{color-scheme:light}
body{margin:0;padding:32px;background:var(--bk-paper);color:var(--bk-ink);font-family:var(--bk-font-sans)}
.t{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--bk-muted);margin:0 0 20px;font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:16px}
.sw{width:150px}.sw i{display:block;height:84px;border-radius:12px;border:1px solid var(--bk-line)}
.sw b{display:block;font-size:13px;font-weight:500;margin-top:8px}.sw span{font:11px var(--bk-font-mono);color:var(--bk-muted)}
.chip{display:inline-flex;font-size:11px;padding:3px 8px;border-radius:8px;background:var(--bk-accent-wash);color:var(--bk-accent);font-weight:500}</style></head><body data-od-id="radius-shadows"><p class="t">Radius and shadows</p><style>.k{width:130px;height:90px;background:#fff;display:grid;place-items:center;font:12px var(--bk-font-mono);border:1px solid var(--bk-line)}</style><div class="row"><div class="k" style="border-radius:2px">2</div><div class="k" style="border-radius:8px">8</div><div class="k" style="border-radius:12px">12</div><div class="k" style="border-radius:16px">16</div><div class="k" style="border-radius:20px">20</div><div class="k" style="border-radius:999px">pill</div></div><div class="row" style="margin-top:32px"><div class="k" style="border-radius:16px;box-shadow:var(--bk-shadow-sm);border:0">sm</div><div class="k" style="border-radius:16px;box-shadow:var(--bk-shadow-md);border:0">md</div><div class="k" style="border-radius:16px;box-shadow:var(--bk-shadow-lg);border:0">lg</div></div></body></html>
