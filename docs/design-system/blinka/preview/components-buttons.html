<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Components — buttons</title><link rel="stylesheet" href="../colors_and_type.css"><style>:root{color-scheme:light}
body{margin:0;padding:32px;background:var(--bk-paper);color:var(--bk-ink);font-family:var(--bk-font-sans)}
.t{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--bk-muted);margin:0 0 20px;font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:16px}
.sw{width:150px}.sw i{display:block;height:84px;border-radius:12px;border:1px solid var(--bk-line)}
.sw b{display:block;font-size:13px;font-weight:500;margin-top:8px}.sw span{font:11px var(--bk-font-mono);color:var(--bk-muted)}
.chip{display:inline-flex;font-size:11px;padding:3px 8px;border-radius:8px;background:var(--bk-accent-wash);color:var(--bk-accent);font-weight:500}</style></head><body data-od-id="components-buttons"><p class="t">Components — buttons</p><div class="row" style="align-items:center"><button class="bk-button bk-button--primary">Get started <span aria-hidden="true">→</span></button><button class="bk-button">Open an account <span aria-hidden="true">→</span></button><button class="bk-button bk-button--small">Get started</button><button class="bk-button bk-button--primary" disabled style="opacity:.4;cursor:not-allowed">Continue</button></div><p style="font-size:13px;color:var(--bk-muted);margin-top:24px">One primary per viewport. Hover swaps ink to accent; focus ring is 2px accent.</p><div class="row" style="margin-top:28px;padding:24px;border-radius:16px;background:var(--bk-night);align-items:center"><button class="bk-button bk-button--primary">Continue</button><span style="color:var(--bk-night-muted);font-size:13px">Primary on night: accent fill, white label.</span></div><p style="font-size:13px;color:var(--bk-muted);margin-top:16px;max-width:560px;line-height:1.6">Specs: pill radius 999px, min-height 48px (38px small), 14px / 500 label, 25px horizontal padding, arrow glyph separated by 25px gap.</p></body></html>
